# MLflow tracking server for tsgen runs, with basic auth (user `admin`).
#   ./up.sh     # first run creates .env (DB + admin passwords) and client env files
# Reachable on this Mac and the LAN at http://<mac-ip>:5050 (login required) and at
# http://mlflow.tsgen-mlflow.arcbox.local:5000 from this Mac.
name: tsgen-mlflow

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_DB: mlflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./up.sh}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  mlflow:
    build: .
    image: tsgen-mlflow:3.16.1-auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./up.sh}
      MLFLOW_ADMIN_PASSWORD: ${MLFLOW_ADMIN_PASSWORD:?run ./up.sh}
      MLFLOW_FLASK_SERVER_SECRET_KEY: ${MLFLOW_FLASK_SERVER_SECRET_KEY:?run ./up.sh}
      MLFLOW_ALLOWED_HOSTS: ${MLFLOW_ALLOWED_HOSTS:?run ./up.sh}
      MLFLOW_CORS_ORIGINS: ${MLFLOW_CORS_ORIGINS:?run ./up.sh}
    ports:
      - "${MLFLOW_PORT:-5050}:5000"
    volumes:
      - artifacts:/mlartifacts
      - auth:/mlauth

volumes:
  db:
  artifacts:
  auth:
